[alembic]
script_location = alembic
prepend_sys_path = .

# Connection URL is read from the environment variable DATABASE_URL (sync).
# In env.py we override sqlalchemy.url programmatically, so this line acts
# only as a fallback / documentation placeholder.
sqlalchemy.url = postgresql+psycopg2://ai103:ai103dev@localhost:5432/ai103_enterprise

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
